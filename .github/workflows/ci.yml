name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: |
          node --check bin/zh-docs-lint.js
          node --check src/cli.js
          node --check src/document.js
          node --check src/rules.js
          node --check src/lint.js
          node --check src/suppress.js
      - name: Unit tests
        run: node --test

  self-lint:
    name: lint this repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      # Dogfooding: the project must pass its own rules.
      - run: node bin/zh-docs-lint.js README.md
